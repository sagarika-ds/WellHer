[project]
name = "wellness-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "cryptography>=42",
  "redis>=5.0",
  "arq>=0.26",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = []  # dependencies only; the app runs from source (see Dockerfile)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501", "I001"]
"tests/**" = ["E501", "B017"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP046"]  # B008: FastAPI Depends() defaults are idiomatic

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async uses greenlets; without this coverage under-reports
