components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          description: (min 12)
        display_name:
          type: string
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentChoice'
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        device:
          type: string
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
    UserOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
    ProfileIn:
      type: object
      properties:
        date_of_birth:
          type: string
          format: date
        height_cm:
          type: number
        weight_kg:
          type: number
        typical_cycle_length:
          type: integer
        contraceptive_use:
          type: boolean
          nullable: true
        conditions_self_reported:
          type: array
          items:
            type: string
        activity_level:
          type: string
        dietary_prefs:
          type: array
          items:
            type: string
        goals:
          type: array
          items:
            type: string
    ProfileOut:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        date_of_birth:
          type: string
          format: date
        height_cm:
          type: number
        weight_kg:
          type: number
        typical_cycle_length:
          type: integer
        contraceptive_use:
          type: boolean
          nullable: true
        conditions_self_reported:
          type: array
          items:
            type: string
        activity_level:
          type: string
        dietary_prefs:
          type: array
          items:
            type: string
        goals:
          type: array
          items:
            type: string
    ConsentChoice:
      type: object
      properties:
        purpose:
          type: string
          description: (health_tracking|ml_processing|llm_external|analytics)
        granted:
          type: boolean
    ConsentSet:
      type: object
      properties:
        granted:
          type: boolean
    ConsentOut:
      type: object
      properties:
        purpose:
          type: string
        granted:
          type: boolean
        version:
          type: string
        granted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    CycleIn:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        flow_intensity:
          type: integer
          description: (1-5)
        notes:
          type: string
          nullable: true
    CycleOut:
