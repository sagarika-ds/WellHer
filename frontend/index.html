<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WellHer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container narrow">
    <!-- Shown by js/index.js after an account is deleted (index.html?deleted=1). -->
    <div id="message" class="alert hidden"></div>
    <div class="card center">
      <h1>WellHer</h1>
      <p class="muted">
        Track your cycle, symptoms, sleep and mood in one private place.
        You choose what your data may be used for.
      </p>
      <div class="stack">
        <a class="btn btn-block" href="login.html">Log in</a>
        <a class="btn btn-secondary btn-block" href="signup.html">Create an account</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">For awareness only, not a medical diagnosis.</footer>

  <script type="module" src="js/index.js"></script>
</body>
</html>
