<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · WellHer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container narrow">
    <form id="login-form" class="card">
      <h1>Log in</h1>

      <div id="message" class="alert hidden"></div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="hint"><a href="forgot.html">Forgot your password?</a></p>
      </div>

      <button id="submit" class="btn btn-block" type="submit">Log in</button>

      <p class="center small mt-4">
        New here? <a href="signup.html">Create an account</a>
      </p>
    </form>
  </main>

  <footer class="site-footer">For awareness only, not a medical diagnosis.</footer>

  <script type="module" src="js/login.js"></script>
</body>
</html>
