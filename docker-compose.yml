# NOTE: written but NOT executed in the authoring sandbox (no Docker daemon there).
services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 10}
    networks: [internal]
  redis:
    image: redis:7
    networks: [internal]
  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrantdata:/qdrant/storage]
    networks: [internal]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]
    networks: [internal]
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes: [mlflowdata:/mlflow]
    networks: [internal]
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]
    networks: [internal, public]
  worker:
    build: ./backend
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [internal]
  ml-engine:
    build: ./ml-engine
    env_file: .env
    depends_on: [qdrant, mlflow]
    expose: ["8100"]
    networks: [internal]
  nginx:
    image: nginx:stable
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["80:80"]
    depends_on: [backend]
    profiles: [prod]
    networks: [public]
  prometheus:
    image: prom/prometheus
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    profiles: [monitoring]
    networks: [internal]
  grafana:
    image: grafana/grafana
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"}
    profiles: [monitoring]
    ports: ["3000:3000"]
    networks: [internal, public]
volumes: {pgdata: {}, qdrantdata: {}, miniodata: {}, mlflowdata: {}}
networks:
  internal: {internal: true}
  public: {}
