name: mobile-ci
on:
  push: {paths: ["mobile/**", "docs/api/openapi.implemented.json"]}
  pull_request: {paths: ["mobile/**", "docs/api/openapi.implemented.json"]}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage --forceExit
      - run: npm run bundle
